name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
          - runtime: win-x86
          - runtime: win-arm64
          - runtime: linux-x64
          - runtime: linux-arm64
          - runtime: linux-arm
          - runtime: osx-x64
          - runtime: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/XGJPlusCore/XGJPlus.csproj

      - name: Publish single-file self-contained
        run: |
          dotnet publish src/XGJPlusCore/XGJPlus.csproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            -o ./publish

      - name: Rename with runtime suffix
        run: |
          cd publish
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            mv XGJPlus.exe "XGJPlus-${{ matrix.runtime }}.exe"
          else
            mv XGJPlus "XGJPlus-${{ matrix.runtime }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XGJPlus-${{ matrix.runtime }}
          path: ./publish/
          if-no-files-found: error

  release:
    name: Auto Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Generate version tag
        id: version
        run: |
          VERSION=$(date +"%Y.%m.%d.%H")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: v${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./bundle
          merge-multiple: true

      - name: Show bundle contents
        run: ls -lh ./bundle/

      - name: Create GitHub Release & upload raw binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "XGJPlus .NET Core ${{ steps.version.outputs.tag }}"
          body: |
            ## ${{ steps.version.outputs.tag }}

            8 平台单文件自包含发布，直接下载即可运行，无需安装 .NET Runtime。

            ### 运行

            ```bash
            # Windows
            XGJPlus-win-x64.exe

            # Linux (x64)
            chmod +x XGJPlus-linux-x64 && ./XGJPlus-linux-x64

            # macOS (Apple Silicon)
            chmod +x XGJPlus-osx-arm64 && ./XGJPlus-osx-arm64
            ```

            ### 许可证

            继承原项目 [AGPL-3.0-only](https://www.gnu.org/licenses/agpl-3.0.html)。
          files: ./bundle/*
          make_latest: true
