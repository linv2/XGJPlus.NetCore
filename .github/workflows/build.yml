name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
          - runtime: win-x86
          - runtime: win-arm64
          - runtime: linux-x64
          - runtime: linux-arm64
          - runtime: linux-arm
          - runtime: osx-x64
          - runtime: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/XGJPlusCore/XGJPlus.csproj

      - name: Publish single-file
        run: |
          dotnet publish src/XGJPlusCore/XGJPlus.csproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=link \
            -o ./artifacts/${{ matrix.runtime }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XGJPlus-${{ matrix.runtime }}
          path: ./artifacts/${{ matrix.runtime }}
          if-no-files-found: error

  release:
    name: Auto Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Generate version tag
        id: version
        run: |
          VERSION=$(date +"%Y.%m.%d.%H")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${TAG}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: false

      - name: Package archives
        run: |
          cd artifacts
          for dir in */; do
            runtime="${dir%/}"
            if [[ "$runtime" == win-* ]]; then
              zip -r "XGJPlus-${runtime}.zip" "$runtime"
            else
              tar -czf "XGJPlus-${runtime}.tar.gz" "$runtime"
            fi
          done
          echo "--- Packaged files ---"
          ls -la *.zip *.tar.gz 2>/dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## XGJPlus .NET Core v${{ steps.version.outputs.version }}

            - 8 平台单文件自包含发布
            - 基于 .NET 10
            - 继承原项目 AGPL-3.0-only 许可证

            ### 运行方式

            ```bash
            # Windows
            XGJPlus.exe

            # Linux / macOS
            chmod +x XGJPlus && ./XGJPlus
            ```

            ### 产物列表
            ${{ join(github.workflow_run.pull_requests, '') }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
